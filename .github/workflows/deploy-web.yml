# Publie Cubito (version web) sur GitHub Pages à chaque envoi sur « main ».
# Adresse : https://<compte>.github.io/<nom-du-dépôt>/
# Réglage unique sur GitHub : Settings → Pages → Source : « GitHub Actions ».
name: Publier Cubito sur le web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get

      # Les tests doivent passer avant toute publication.
      - run: flutter test

      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # Solveur rapide dans un « Web Worker » (l'écran ne se fige pas).
      - run: dart compile js -O2 -o build/web/solver_worker.js web_worker/solver_worker.dart && rm -f build/web/solver_worker.js.deps

      # Recharger une page intérieure ne donne pas d'erreur 404.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
